name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: pi
    attributes:
      label: How does Pi handle this?
      description: piglet follows the Pi coding agent's behaviour. Say if Pi already does this, or why piglet should differ.
