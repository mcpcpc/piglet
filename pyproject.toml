[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "piglet"
version = "0.7.0"
description = "A minimalist GUI coding-agent harness that re-implements the Pi coding agent."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Michael Czigler" }]
keywords = ["coding-agent", "llm", "ai", "agent", "pi"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "pathspec==1.1.1",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = [
    "coverage==7.17.3",
    "ruff==0.17.5",
]
build = [
    "pyinstaller==6.22.3",
]

[project.urls]
Homepage = "https://github.com/mcpcpc/piglet"
Issues = "https://github.com/mcpcpc/piglet/issues"
Releases = "https://github.com/mcpcpc/piglet/releases"
Security = "https://github.com/mcpcpc/piglet/security/policy"

[project.scripts]
piglet = "piglet.launcher:main"
piglet-server = "piglet.server.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/piglet"]
artifacts = ["src/piglet/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true  # required for PLR0904
extend-select = ["C901", "PLR0913", "PLR0904", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.coverage.run]
source = ["src/piglet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
